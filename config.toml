# Stimulation Server Configuration

[run]
mock_mode = true
active_experiment = "m1_mapping_low"
active_timed_random_protocol = "m1_random_timed"
active_movement_triggered_protocol = "m2_movement_triggered"
log_triggers = true

[logging]
data_root = "D:\\data\\raw"
stim_events_enabled = true
stim_event_dir = "logs/stim_events"

# TODO (channel mapping): these entries are PLACEHOLDERS. Map each stimulator
# channel number to its physical electrode contact using the electrode/
# stimulator documentation, then fill `physical_contact` and fix `label`.
# Until then, run_stimulation.py / manual_stimulation.py log unmapped channels
# as "unknown" and print a warning (they do not stop).
[channel_map."1"]
label = "left_m1_placeholder"
physical_contact = ""
target = "M1"
hemisphere = "left"
notes = "Replace after checking electrode/stimulator documentation."

[channel_map."2"]
label = "right_m1_placeholder"
physical_contact = ""
target = "M1"
hemisphere = "right"
notes = "Replace after checking electrode/stimulator documentation."

[channel_map."3"]
label = "m2_placeholder"
physical_contact = ""
target = "M2"
hemisphere = "unknown"
notes = "Replace channel number/label after checking M2 electrode and stimulator documentation."

[pycontrol_events]
# Manual and timed-random stimulation can send these markers to a pyControl UARTlink.
# Keep disabled until the pyControl task starts hw.bci_link and handles cursor_update.
enabled = false
port = "COM3"
baud_rate = 9600

[pycontrol_events.codes]
session_start = 110
session_end = 111
stim_on = 101
stim_off = 102
stim_pulse = 103
stim_sham = 104

[hardware]
# Wireless Dongle Port. Real-mode scripts try these in order and use the
# one currently detected by pyserial.
stimulator_ports = ["COM8", "COM9"]
# Fallback for older scripts/tests that expect one configured port.
stimulator_port = "COM9"
# Optional: folder containing trim_cal_data.mat, matching BMI's path_cal_ws.
# calibration_dir = 'C:\Program Files (x86)\Ripple'

# Link to Behavior PC (USB-TTL Adapter)
trigger_port = "COM3"
baud_rate = 9600

[stimulation.brain_standard]
freq = 130          # Hz
amp = 0.02          # mA
pw = 0.2            # ms
duration = 0.5      # seconds
channel = [1]       # Active electrode(s)
inter_phase = 50e-6 # seconds

[stimulation.brain_standard_single_pulse]
freq = 130
amp = 0.02
pw = 0.2
duration = 0.5
pulse_mode = "single_pulse"
single_pulse_train_ms = 1.0
channel = [1]
inter_phase = 50e-6

[stimulation.brain_strong]
freq = 200
amp = 0.10
pw = 0.2
duration = 0.5
channel = [1]
inter_phase = 50e-6

[stimulation.muscle_test]
freq = 30
amp = 2.0
pw = 0.4
duration = 1.0
channel = [2, 4]
inter_phase = 50e-6

# First-pass M1 behavioral mapping block.
# Replace channel = [1, 2] with the real [left_m1, right_m1] stim channels
# before setting the experiment's real_enabled flag to true.
[stimulation.m1_mapping_low]
freq = 50
amp = 0.05
pw = 0.2
duration = 0.2        # seconds, used when pulse_mode = "train"
pulse_mode = "train"  # "train" or "single_pulse"
# single_pulse_train_ms = 1.0 # optional; auto-computed if omitted
channel = [1, 2]
inter_phase = 50e-6

# First-pass M2 timing perturbation profile.
# Replace channel = [3] with the real M2 stimulator channel before enabling
# real hardware for [experiments.m2_timing].
[stimulation.m2_timing]
freq = 50
amp = 0.05
pw = 0.2
duration = 0.2        # seconds, used when pulse_mode = "train"
pulse_mode = "train"
channel = [3]
inter_phase = 50e-6

[timed_random_protocols.m1_random_timed]
profile = "m1_mapping_low"
interval_s = 10.0
real_enabled = false
description = "Fixed-interval random sham/low/high M1 train stimulation."

# Timed-random conditions use the channels selected by the profile above.
# A scalar amp applies the same amplitude to every selected channel.

[[timed_random_protocols.m1_random_timed.conditions]]
name = "sham"
sham = true
amp = 0
duration = 0.2

[[timed_random_protocols.m1_random_timed.conditions]]
name = "low_amp"
amp = 0.025
duration = 0.2

[[timed_random_protocols.m1_random_timed.conditions]]
name = "high_amp"
amp = 0.05
duration = 0.2

[timed_random_protocols.m2_random_timed]
profile = "m2_timing"
interval_s = 10.0
real_enabled = false
description = "Fixed-interval random sham/low/high M2 train stimulation."

[[timed_random_protocols.m2_random_timed.conditions]]
name = "sham"
sham = true
amp = 0
duration = 0.2

[[timed_random_protocols.m2_random_timed.conditions]]
name = "low_amp"
amp = 0.025
duration = 0.2

[[timed_random_protocols.m2_random_timed.conditions]]
name = "high_amp"
amp = 0.05
duration = 0.2

[movement_triggered_protocols.m2_movement_triggered]
profile = "m2_timing"
duration = 0.2
trigger_code = 1
real_enabled = false
description = "Movement-triggered random sham/low/high M2 train stimulation."

[[movement_triggered_protocols.m2_movement_triggered.conditions]]
name = "sham"
sham = true
amp = 0

[[movement_triggered_protocols.m2_movement_triggered.conditions]]
name = "low_amp"
amp = 0.025

[[movement_triggered_protocols.m2_movement_triggered.conditions]]
name = "high_amp"
amp = 0.05

[experiments.m1_mapping_low]
profile = "m1_mapping_low"
real_enabled = true
description = "Stationary/onset/delayed M1 mapping, low-amplitude block."

[experiments.m1_mapping_low.commands.1]
name = "sham"
pw_fraction = [0, 0]

[experiments.m1_mapping_low.commands.2]
name = "left_m1"
pw_fraction = [1, 0]

[experiments.m1_mapping_low.commands.3]
name = "right_m1"
pw_fraction = [0, 1]

[experiments.m1_mapping_low.commands.4]
name = "bilateral"
pw_fraction = [1, 1]

[experiments.m2_timing]
profile = "m2_timing"
real_enabled = false
description = "Task 6 M2 timing perturbation, sham vs M2 stimulation."

[experiments.m2_timing.commands.1]
name = "sham"
pw_fraction = [0]

[experiments.m2_timing.commands.2]
name = "m2_stim"
pw_fraction = [1]

[experiments.brain_standard]
profile = "brain_standard"
real_enabled = false
description = "Standard single-channel brain stimulation test."

[experiments.brain_standard.commands.1]
name = "stim"
pw_fraction = [1]

[experiments.brain_standard_single_pulse]
profile = "brain_standard_single_pulse"
real_enabled = false
description = "Standard single-channel brain stimulation, one run-once pulse."

[experiments.brain_standard_single_pulse.commands.1]
name = "stim"
pw_fraction = [1]
