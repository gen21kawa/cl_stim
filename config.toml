# Stimulation Server Configuration

[run]
mock_mode = true
# Load experiment-specific stimulation settings from one small file.
experiment_config = "configs/m2_movement_triggered.toml"
log_triggers = true

[logging]
data_root = "D:\\data\\raw"
stim_events_enabled = true
stim_event_dir = "logs/stim_events"

# TODO (channel mapping): these entries are PLACEHOLDERS. Map each stimulator
# channel number to its physical electrode contact using the electrode/
# stimulator documentation, then fill `physical_contact` and fix `label`.
# Until then, run_stimulation.py / manual_stimulation.py log unmapped channels
# as "unknown" and print a warning (they do not stop).
[channel_map."1"]
label = "left_m1_placeholder"
physical_contact = ""
target = "M1"
hemisphere = "left"
notes = "Replace after checking electrode/stimulator documentation."

[channel_map."2"]
label = "right_m1_placeholder"
physical_contact = ""
target = "M1"
hemisphere = "right"
notes = "Replace after checking electrode/stimulator documentation."

[channel_map."3"]
label = "m2_placeholder"
physical_contact = ""
target = "M2"
hemisphere = "unknown"
notes = "Replace channel number/label after checking M2 electrode and stimulator documentation."

[pycontrol_events]
# Manual and timed-random stimulation can send these markers to a pyControl UARTlink.
# Keep disabled until the pyControl task starts hw.bci_link and handles cursor_update.
enabled = false
port = "COM3"
baud_rate = 9600

[pycontrol_events.codes]
session_start = 110
session_end = 111
stim_on = 101
stim_off = 102
stim_pulse = 103
stim_sham = 104

[hardware]
# Wireless Dongle Port. Real-mode scripts try these in order and use the
# one currently detected by pyserial.
stimulator_ports = ["COM8", "COM9"]
# Fallback for older scripts/tests that expect one configured port.
stimulator_port = "COM9"
# Optional: folder containing trim_cal_data.mat, matching BMI's path_cal_ws.
# calibration_dir = 'C:\Program Files (x86)\Ripple'

# Link to Behavior PC (USB-TTL Adapter)
trigger_port = "COM3"
baud_rate = 9600
